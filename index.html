<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#120905">
<title>Hamarosan valami nagy jön...</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  font-family: 'Fredoka', sans-serif;
  color: #fbefdc;
  text-align: center;
  background:
    radial-gradient(ellipse at 50% 40%,
      rgba(255,138,61,.2),
      transparent 60%),
    #120905;
}

.container {
  max-width: 700px;
  animation: appear 1.2s ease both;
}

h1 {
  margin: 0 0 24px;
  font-size: clamp(42px, 9vw, 76px);
  font-weight: 700;
  line-height: 1.1;
  background: linear-gradient(90deg, #ffd98a, #ff8a3d, #ffd98a);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shimmer 5s linear infinite;
}

p {
  margin: 0;
  color: #c9a77d;
  font-size: clamp(17px, 4vw, 23px);
  line-height: 1.7;
}

@keyframes shimmer {
  to { background-position: 200% center; }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
  }
}
</style>
</head>
<body>
  <main class="container">
    <h1>Valami nagy fog jönni</h1>
    <p>A Kakifilmek jelenleg megújul, hogy még jobb lehessen.</p>
  </main>
</body>
</html>
